<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Install App</title>
<meta name="theme-color" content="#ff3b5c">
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  /* ============ BOUTON FLOTTANT ============ */
  #pwa-in {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    right: 16px;
    z-index: 2147483647;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 18px;
    border: 0;
    border-radius: 99px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .02em;
    color: #fff;
    cursor: pointer;
    background: linear-gradient(135deg, #ff5e7c, #ff3b5c);
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.55),
      inset 0 -4px 8px rgba(70,0,20,.45),
      0 8px 22px rgba(255,59,92,.5);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    animation: pwaPulse 2.4s ease-in-out infinite;
  }
  #pwa-in:active { transform: scale(.94); }
  #pwa-in svg { width: 16px; height: 16px; flex-shrink: 0; }
  #pwa-in.hide { display: none; }

  @keyframes pwaPulse {
    0%,100% {
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.55),
        inset 0 -4px 8px rgba(70,0,20,.45),
        0 8px 22px rgba(255,59,92,.5);
    }
    50% {
      box-shadow:
        inset 0 2px 1px rgba(255,255,255,.55),
        inset 0 -4px 8px rgba(70,0,20,.45),
        0 8px 26px rgba(255,59,92,.8);
    }
  }

  /* ============ MODAL iOS ============ */
  #pwa-ios-m {
    position: fixed;
    inset: 0;
    z-index: 2147483647;
    display: none;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(3px);
    font-family: inherit;
  }
  #pwa-ios-m.on { display: flex; }
  #pwa-ios-m .c {
    background: #0d0b1e;
    color: #f5f5fa;
    border: 1px solid rgba(255,255,255,.14);
    width: 100%;
    max-width: 440px;
    border-radius: 22px 22px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
    animation: pwaUp .25s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes pwaUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  #pwa-ios-m h3 { margin: 0 0 14px; font-size: 17px; font-weight: 800; }
  #pwa-ios-m p  { margin: 0 0 10px; font-size: 14px; line-height: 1.5; opacity: .85; }
  #pwa-ios-m b  { color: #ff5e7c; }
  #pwa-ios-m button {
    margin-top: 16px;
    width: 100%;
    padding: 13px;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff5e7c, #ff3b5c);
    color: #fff;
    font-family: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: inset 0 2px 1px rgba(255,255,255,.5), 0 8px 20px rgba(255,59,92,.5);
  }
</style>
</head>
<body>

  <!-- ============ BOUTON ============ -->
  <button id="pwa-in" type="button" aria-label="Installer l'application">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v12"/>
      <path d="M7 10l5 5 5-5"/>
      <path d="M5 21h14"/>
    </svg>
    Install App
  </button>

  <!-- ============ MODAL iOS ============ -->
  <div id="pwa-ios-m" role="dialog" aria-modal="true">
    <div class="c">
      <h3>Installer l'application</h3>
      <p>1. Appuyez sur <b>Partager</b> dans Safari.</p>
      <p>2. Choisissez <b>? Sur l'¨¦cran d'accueil ?</b>.</p>
      <p>3. Appuyez sur <b>? Ajouter ?</b>.</p>
      <button type="button">Compris</button>
    </div>
  </div>

<script>
(function () {
  'use strict';
  if (window.__pwaBtn) return;
  window.__pwaBtn = 1;

  var $ = function (id) { return document.getElementById(id); };
  var btn   = $('pwa-in');
  var modal = $('pwa-ios-m');

  /* ---------- 1. Ic?nes PNG g¨¦n¨¦r¨¦es (valides pour Chrome) ---------- */
  function makeIcon(size) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var r = size * 0.22;
    var g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#ff5e7c');
    g.addColorStop(1, '#ff3b5c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#fff';
    ctx.font = '900 ' + Math.round(size * 0.46) + 'px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('B3', size / 2, size / 2 + size * 0.03);

    return c.toDataURL('image/png');
  }

  var ICON_192 = makeIcon(192);
  var ICON_512 = makeIcon(512);

  /* ---------- 2. Manifeste ---------- */
  if (!document.querySelector('link[rel="manifest"]')) {
    var manifest = {
      name: document.title || 'Boost3000',
      short_name: 'B3',
      start_url: '/',
      scope: '/',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#07070d',
      theme_color: '#ff3b5c',
      icons: [
        { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: ICON_192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: ICON_512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };
    var link = document.createElement('link');
    link.rel = 'manifest';
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/json' }));
    document.head.appendChild(link);
  }

  /* ---------- 3. Service Worker inline ---------- */
  var SW_CODE =
    "self.addEventListener('install',()=>self.skipWaiting());" +
    "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));" +
    "self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));";

  if ('serviceWorker' in navigator) {
    if (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {
      window.addEventListener('load', function () {
        navigator.serviceWorker
          .register(URL.createObjectURL(new Blob([SW_CODE], { type: 'application/javascript' })), { scope: '/' })
          .then(function (r) { console.log('[PWA] SW OK', r.scope); })
          .catch(function (e) { console.warn('[PWA] SW KO', e); });
      });
    } else {
      console.warn('[PWA] HTTPS requis pour activer le Service Worker.');
    }
  }

  /* ---------- 4. D¨¦tection ---------- */
  var deferredPrompt = null;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
                     navigator.standalone === true;

  // D¨¦j¨¤ install¨¦e ¡ú cacher le bouton
  if (isStandalone) {
    btn.classList.add('hide');
  }

  // Android / Chrome / Edge : prompt natif
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    btn.classList.remove('hide');
  });

  /* ---------- 5. Clic ---------- */
  btn.addEventListener('click', async function (e) {
    e.stopPropagation();

    // iOS ¡ú modal d'instructions
    if (isIOS && !deferredPrompt) {
      modal.classList.add('on');
      return;
    }

    // Android / Chrome ¡ú prompt natif
    if (deferredPrompt) {
      deferredPrompt.prompt();
      try {
        await deferredPrompt.userChoice;
      } catch (err) {}
      deferredPrompt = null;
      btn.classList.add('hide');
      return;
    }

    // Fallback : navigateur pas pr¨ºt
    alert("Pour installer : menu du navigateur ¡ú ? Installer l'application ? / ? Ajouter ¨¤ l'¨¦cran d'accueil ?.");
  });

  /* ---------- 6. Modal iOS ---------- */
  modal.querySelector('button').addEventListener('click', function () {
    modal.classList.remove('on');
  });
  modal.addEventListener('click', function (e) {
    if (e.target === modal) modal.classList.remove('on');
  });

  /* ---------- 7. ?v¨¦nement install¨¦ ---------- */
  window.addEventListener('appinstalled', function () {
    btn.classList.add('hide');
    deferredPrompt = null;
  });
})();
</script>
</body>
</html>

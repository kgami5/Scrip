<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost3000 • Order</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ar:255 59 92;--ar2:255 94 124;--a3:#b0103a;--bg:#07070d;--line:rgba(255,255,255,.12);--txt:#f5f5fa;--mut:rgba(245,245,250,.6);--a1:#ff5e7c;--a2:#ff3b5c;--g1:#ffc53d;--g2:#ff5a1f;--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);font-family:'Inter',system-ui,sans-serif;min-height:100vh;color:var(--txt)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:2px solid #fff;outline-offset:3px}

/* ===== Overlay ===== */
.ph-overlay{position:fixed;left:0;top:0;width:100%;height:var(--vh,100%);z-index:2147483000;overflow:hidden;touch-action:none;font-family:'Inter',system-ui,sans-serif;
  background:radial-gradient(ellipse at 50% 35%,#2a1250 0,#0c0a1c 55%,#05050b 100%)}
.ph-overlay canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#phFx{z-index:5}
.ph-rainbow{position:absolute;left:50%;bottom:-10vmin;width:160vmin;height:80vmin;transform:translateX(-50%);pointer-events:none;
  background:radial-gradient(circle at 50% 100%,transparent 52%,#ff3b5c 53%,#ff9a3c 56%,#ffe14d 59%,#4dff88 62%,#4dd2ff 65%,#6a5cff 68%,#c04dff 71%,transparent 72%);
  opacity:.4;filter:blur(8px)}
.ph-stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1400px}
.ph-float{animation:flt 6s ease-in-out infinite;transform-style:preserve-3d}
@keyframes flt{50%{transform:translateY(-14px)}}

/* ===== Téléphone ===== */
.ph{--h:var(--ph,min(76vh,640px));--u:calc(var(--h)/100);--rx:6deg;--ry:-12deg;--gx:50%;
  position:relative;height:var(--h);width:calc(var(--h)*.485);transform-style:preserve-3d;
  transform:rotateX(6deg) rotateY(-12deg);will-change:transform;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.ph:active{cursor:grabbing}
.ph-layer,.ph-body{position:absolute;inset:0;border-radius:calc(var(--u)*9)}
.ph-layer{background:linear-gradient(160deg,#5b5f78,#1a1b26 50%,#4a4e66)}
.ph-body{background:conic-gradient(from var(--ang,210deg) at 50% 50%,#4a4e66,#14151f,#6b7090,#14151f,#4a4e66);
  box-shadow:0 0 0 2px rgba(255,255,255,.16),0 0 70px rgb(var(--ar) / .5),0 0 150px rgba(120,80,255,.4),0 50px 90px rgba(0,0,0,.7)}
.ph-bezel{position:absolute;inset:calc(var(--u)*1.1);border-radius:calc(var(--u)*8);background:#050509;transform:translateZ(1px)}
.ph-screen{position:absolute;inset:calc(var(--u)*2.4);border-radius:calc(var(--u)*6.8);transform-style:preserve-3d;transform:translateZ(2px);}
.ph-bg{position:absolute;inset:0;border-radius:inherit;overflow:hidden;
  background:radial-gradient(circle at 20% 10%,#4b1d7a,transparent 55%),radial-gradient(circle at 90% 85%,#1d3a8a,transparent 55%),#0d0b1e}
.ph-bg::after{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgb(var(--ar2) / .18),transparent 30%,rgba(77,210,255,.15),transparent 60%);animation:spin 12s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.ph-island{position:absolute;top:calc(var(--u)*2.3);left:50%;width:30%;height:calc(var(--u)*3.4);transform:translate(-50%,0) translateZ(3px);background:#000;border-radius:99px;box-shadow:inset 0 0 0 1px #1d1d26}
.ph-status{position:absolute;top:calc(var(--u)*2.7);left:calc(var(--u)*6);right:calc(var(--u)*6);display:flex;justify-content:space-between;font-size:calc(var(--u)*2);font-weight:700;transform:translateZ(3px)}
.ph-clock{text-align:center;font-weight:800;font-size:calc(var(--u)*7);letter-spacing:-.03em;line-height:1;transform:translateZ(8px);text-shadow:0 4px 20px rgb(var(--ar2) / .5)}
.ph-date{text-align:center;font-size:calc(var(--u)*1.9);color:var(--mut);margin:calc(var(--u)*1) 0 calc(var(--u)*3);transform:translateZ(6px)}
.ph-free{position:relative;overflow:hidden;width:100%;padding:calc(var(--u)*2.4);border-radius:calc(var(--u)*3);font-weight:800;font-size:calc(var(--u)*2.6);color:#fff;
  background:linear-gradient(135deg,var(--g1),var(--g2));transform:translateZ(14px);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.55),inset 0 -4px 8px rgba(120,20,0,.35),0 calc(var(--u)*1.4) calc(var(--u)*2.8) rgba(255,90,31,.5)}
.ph-apps{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--u)*3.2) calc(var(--u)*2);margin-top:calc(var(--u)*2.6);transform-style:preserve-3d}
.app{--tx:0deg;--ty:0deg;display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*1.2);transform-style:preserve-3d;position:relative}
.tile{position:relative;width:100%;aspect-ratio:1;border-radius:27%;display:grid;place-items:center;overflow:hidden;
  background:var(--bg);color:#fff;font-size:calc(var(--u)*6.4);
  transform:translateZ(calc(var(--u)*4)) rotateX(var(--tx)) rotateY(var(--ty));transition:transform .25s cubic-bezier(.3,1.4,.5,1),box-shadow .25s;
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -7px 12px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12),
             0 calc(var(--u)*1.6) calc(var(--u)*2.6) rgba(0,0,0,.55),0 0 calc(var(--u)*3.6) var(--glow)}
.tile::before{content:"";position:absolute;left:4%;right:4%;top:3%;height:48%;border-radius:50% 50% 55% 55%/70% 70% 40% 40%;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.04));z-index:1}
.tile::after{content:"";position:absolute;inset:-20%;z-index:3;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%);
  transform:translateX(-130%);animation:sweep 4.2s var(--d) infinite}
@keyframes sweep{55%,100%{transform:translateX(130%)}}
.app:hover .tile{transform:translateZ(calc(var(--u)*8)) rotateX(var(--tx)) rotateY(var(--ty)) scale(1.07);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.7),inset 0 -7px 12px rgba(0,0,0,.4),0 calc(var(--u)*3.4) calc(var(--u)*4.6) rgba(0,0,0,.6),0 0 calc(var(--u)*6.5) var(--glow)}
.app:active .tile{transform:translateZ(calc(var(--u)*2)) scale(.94)}
.app span{font-size:calc(var(--u)*1.9);font-weight:700;transform:translateZ(calc(var(--u)*3));text-shadow:0 2px 6px #000}
.hot{position:absolute;top:calc(var(--u)*-1);right:calc(var(--u)*-.6);z-index:4;transform:translateZ(calc(var(--u)*10));
  background:linear-gradient(135deg,#ff5e7c,#ff1f48);font-size:calc(var(--u)*1.5);font-weight:800;padding:2px calc(var(--u)*1.4);border-radius:99px;
  box-shadow:0 3px 10px rgb(var(--ar) / .7);animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:translateZ(calc(var(--u)*10)) scale(1.12)}}
.ph-dock{position:absolute;left:calc(var(--u)*4);right:calc(var(--u)*4);bottom:calc(var(--u)*3);display:flex;justify-content:space-around;
  padding:calc(var(--u)*1.6);border-radius:calc(var(--u)*4);background:rgba(255,255,255,.09);border:1px solid var(--line);transform:translateZ(12px);
  }
.dk{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:30%;display:grid;place-items:center;font-size:calc(var(--u)*3.4);
  background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.04));box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.4);transition:.2s}
.dk:hover{background:var(--a2);transform:translateY(-3px)}
.ph-gloss{position:absolute;inset:0;border-radius:calc(var(--u)*9);pointer-events:none;transform:translateZ(30px);
  background:linear-gradient(115deg,transparent calc(var(--gx) - 24%),rgba(255,255,255,.2) var(--gx),transparent calc(var(--gx) + 24%))}
.ph-btn{position:absolute;width:calc(var(--u)*.7);background:#7b7f9a;border-radius:3px}
.ph-x{position:absolute;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.1);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;}
.ph-x:hover{background:var(--a2)}

/* ===== Icônes SVG ===== */
.i{display:inline-block;width:1em;height:1em;vertical-align:-.14em}
.i svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile svg.lg{width:54%;height:54%;position:relative;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.45))}

/* ===== HUD : bouton flottant motion-control ===== */
.hud{position:fixed;right:22px;bottom:calc(26px + var(--sb));width:76px;height:76px;z-index:2147483647;--mx:0px;--my:0px}
.hud-dim{position:fixed;inset:0;z-index:-1;opacity:0;pointer-events:none;transition:opacity .4s;
  background:radial-gradient(circle at 92% 94%,rgb(var(--ar) / .28),rgba(5,5,12,.72) 55%);}
.hud.open .hud-dim{opacity:1;pointer-events:auto}
.hud-tracks{position:absolute;left:50%;top:50%;width:440px;height:440px;margin:-220px;pointer-events:none;overflow:visible}
.hud-tracks circle{fill:none;stroke-linecap:round;opacity:0;transition:opacity .5s .1s}
.hud.open .hud-tracks circle{opacity:1}
.t1{stroke:rgb(var(--ar2) / .55);stroke-width:1.2;stroke-dasharray:2 7;transform-origin:220px 220px;animation:spin 40s linear infinite}
.t2{stroke:rgba(120,200,255,.4);stroke-width:1.2;stroke-dasharray:1 10 24 10;transform-origin:220px 220px;animation:spin 60s linear infinite reverse}
.hud-fab{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.hud-fab:hover{transform:scale(1.06)}
.hud-fab .r{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.r1{animation:spin 16s linear infinite}.r2{animation:spin 6s linear infinite reverse}
.hud.open .r1{animation-duration:5s}.hud.open .r2{animation-duration:2.2s}
.orb{position:absolute;inset:-2px;animation:spin 3.4s linear infinite}
.orb::after{content:"";position:absolute;top:0;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px var(--a1),0 0 22px 6px rgb(var(--ar2) / .7)}
.hud.open .orb{animation-duration:1.4s}
.core{position:relative;width:52px;height:52px;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-size:24px;
  transform:translate(var(--mx),var(--my));transition:transform .15s ease-out;
  background:radial-gradient(circle at 35% 28%,var(--a1),var(--a2) 45%,var(--a3) 100%);
  box-shadow:inset 0 2px 2px rgba(255,255,255,.6),inset 0 -8px 14px rgba(70,0,20,.55),0 0 26px rgb(var(--ar) / .75),0 10px 26px rgba(0,0,0,.5)}
.core::before{content:"";position:absolute;left:12%;right:12%;top:4%;height:44%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.core::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 0deg,transparent 70%,rgba(255,255,255,.45) 92%,transparent);animation:spin 2.6s linear infinite}
.core .i{position:absolute;z-index:2;transition:transform .5s cubic-bezier(.3,1.5,.5,1),opacity .25s;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.core .ix{transform:rotate(-90deg) scale(.3);opacity:0}
.hud.open .core .ig{transform:rotate(90deg) scale(.3);opacity:0}
.hud.open .core .ix{transform:none;opacity:1}
.hud-ping{position:absolute;inset:12px;border-radius:50%;border:2px solid rgb(var(--ar2) / .7);animation:ping 2.6s ease-out infinite;pointer-events:none}
@keyframes ping{to{transform:scale(1.9);opacity:0}}
.hn{--x:0px;--y:0px;--i:0;position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px;
  background:var(--bg,linear-gradient(145deg,rgba(60,62,84,.95),rgba(16,17,28,.95)));
  box-shadow:inset 0 1.5px 1px rgba(255,255,255,.55),inset 0 -5px 9px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.14),0 10px 20px rgba(0,0,0,.55),0 0 18px var(--glow,rgba(255,255,255,.12));
  transform:translate(0,0) scale(.2) rotate(-120deg);opacity:0;pointer-events:none;
  transition:transform .55s cubic-bezier(.2,1.6,.4,1) calc(var(--i)*38ms),opacity .25s calc(var(--i)*38ms),box-shadow .2s}
.hud.open .hn{transform:translate(var(--x),var(--y)) scale(1);opacity:1;pointer-events:auto}
.hud:not(.open) .hn{transition-delay:0ms}
.hn::before{content:"";position:absolute;left:10%;right:10%;top:4%;height:46%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0))}
.hn svg.lg{width:52%;height:52%;position:relative;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.hn .i{position:relative}
.hud.open .hn:hover{transform:translate(var(--x),var(--y)) scale(1.22);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.7),0 14px 26px rgba(0,0,0,.6),0 0 30px var(--glow,rgba(255,255,255,.5))}
.hn em{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);font-style:normal;font-size:11px;font-weight:700;white-space:nowrap;
  padding:4px 10px;border-radius:99px;background:rgba(10,10,18,.92);border:1px solid var(--line);opacity:0;pointer-events:none;transition:.2s}
.hn:hover em,.hn:focus-visible em{opacity:1;transform:translate(-50%,0)}
.b3-toast{position:fixed;left:50%;bottom:calc(120px + var(--sb));z-index:2147483647;transform:translate(-50%,10px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:10px 20px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(22,23,34,.95);border:1px solid var(--line);transition:.25s}
.b3-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:550px){.hud{right:14px;transform-origin:100% 100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
/* ===== OS du téléphone ===== */
.scr{position:absolute;left:calc(var(--u)*5);right:calc(var(--u)*5);top:calc(var(--u)*10.5);bottom:calc(var(--u)*13.5);display:none;flex-direction:column;transform-style:preserve-3d}
.scr.on{display:flex;animation:scrIn .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes scrIn{from{transform:translateZ(calc(var(--u)*-6)) scale(.92)}}
.norb .ph-rainbow{display:none}
.xp{display:flex;align-items:center;gap:calc(var(--u)*1.6);padding:calc(var(--u)*1.6) calc(var(--u)*2);margin-bottom:calc(var(--u)*2);border-radius:calc(var(--u)*3);font-size:calc(var(--u)*1.8);
  background:rgba(255,255,255,.07);border:1px solid var(--line);transform:translateZ(10px);box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 6px 14px rgba(0,0,0,.3)}
.xpbar{flex:1;height:calc(var(--u)*1.2);border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
.xpbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--a1),var(--g1));box-shadow:0 0 10px var(--a1);transition:width .6s}
.xp small{color:var(--mut)}
.ttl{font-size:calc(var(--u)*3.6);font-weight:800;letter-spacing:-.02em;margin-bottom:calc(var(--u)*2.4);transform:translateZ(8px)}
.gc{display:flex;align-items:center;gap:calc(var(--u)*2.2);width:100%;padding:calc(var(--u)*1.8);margin-bottom:calc(var(--u)*1.8);border-radius:calc(var(--u)*3.2);text-align:left;
  background:rgba(255,255,255,.07);border:1px solid var(--line);transform:translateZ(calc(var(--u)*2));transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .2s;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.25),0 8px 18px rgba(0,0,0,.35)}
.gc:hover{transform:translateZ(calc(var(--u)*6)) scale(1.03);background:rgba(255,255,255,.13)}
.gc b{display:block;font-size:calc(var(--u)*2.3)}.gc small{color:var(--mut);font-size:calc(var(--u)*1.7)}
.gi{width:calc(var(--u)*8);height:calc(var(--u)*8);flex:none;border-radius:28%;display:grid;place-items:center;font-size:calc(var(--u)*4);background:var(--bg);
  box-shadow:inset 0 2px 1px rgba(255,255,255,.6),inset 0 -5px 9px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.5)}
.op{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*1.4) calc(var(--u)*.6);font-size:calc(var(--u)*2.1);font-weight:600;border-bottom:1px solid var(--line)}
.sw{flex:none;width:calc(var(--u)*7);height:calc(var(--u)*4);border-radius:99px;background:rgba(255,255,255,.16);position:relative;transition:.3s;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
.sw::after{content:"";position:absolute;top:calc(var(--u)*.4);left:calc(var(--u)*.4);width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.5);transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.sw[aria-pressed=true]{background:linear-gradient(90deg,var(--a1),var(--a2));box-shadow:0 0 12px var(--a1)}
.sw[aria-pressed=true]::after{transform:translateX(calc(var(--u)*3))}
.ths{display:flex;gap:calc(var(--u)*1.6);justify-content:center;margin:calc(var(--u)*2.2) 0}
.th{width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:50%;border:2px solid transparent;box-shadow:inset 0 2px 1px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.5);transition:transform .2s}
.th:hover{transform:scale(1.18)}.th.on{border-color:#fff;box-shadow:0 0 14px #fff}
.rst{margin-top:auto;padding:calc(var(--u)*1.5);border-radius:calc(var(--u)*2.6);background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:calc(var(--u)*1.9);font-weight:600}
.dk.act{background:linear-gradient(145deg,var(--a1),var(--a2));box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 0 16px rgb(var(--ar) / .7)}
.gh{display:flex;align-items:center;gap:calc(var(--u)*1.6);margin-bottom:calc(var(--u)*1.6);font-size:calc(var(--u)*2.3);transform:translateZ(8px)}
.gh b{flex:1;font-weight:800}.gh span{font-weight:800;font-variant-numeric:tabular-nums;color:var(--g1)}
.bk{width:calc(var(--u)*5);height:calc(var(--u)*5);border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:calc(var(--u)*2.6)}
.garea{position:relative;flex:1;border-radius:calc(var(--u)*3);overflow:hidden;background:rgba(0,0,0,.3);border:1px solid var(--line);display:grid;place-items:center;box-shadow:inset 0 4px 14px rgba(0,0,0,.5)}
.big{position:absolute;top:calc(var(--u)*2);left:0;right:0;text-align:center;font-size:calc(var(--u)*6);font-weight:900;text-shadow:0 0 20px rgb(var(--ar) / .8)}
.gmsg{position:absolute;bottom:calc(var(--u)*2);left:0;right:0;text-align:center;font-size:calc(var(--u)*1.9);color:var(--mut)}
.orb2{position:relative;width:calc(var(--u)*19);height:calc(var(--u)*19);border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:calc(var(--u)*3.6);font-weight:900;color:#fff;touch-action:manipulation;
  background:radial-gradient(circle at 35% 28%,var(--a1),var(--a2) 50%,var(--a3));transition:transform .08s;
  box-shadow:inset 0 3px 3px rgba(255,255,255,.6),inset 0 -12px 18px rgba(0,0,0,.45),0 0 40px rgb(var(--ar) / .8),0 14px 26px rgba(0,0,0,.6)}
.orb2::before{content:"";position:absolute;left:14%;right:14%;top:5%;height:44%;border-radius:50%;background:linear-gradient(rgba(255,255,255,.6),rgba(255,255,255,0))}
.orb2.hit{transform:scale(.9)}.orb2 span{position:relative}
.ring{position:absolute;width:calc(var(--u)*26);height:calc(var(--u)*26);transform:rotate(-90deg);pointer-events:none}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}.ring .bgc{stroke:rgba(255,255,255,.1)}
.ring #tapRing{stroke:var(--g1);stroke-dasharray:314;stroke-dashoffset:0;filter:drop-shadow(0 0 6px var(--g1))}
.res{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.4);text-align:center;padding:calc(var(--u)*3);z-index:5;font-size:calc(var(--u)*2.1);

      ctx.fillText('$', cx, cy + 1);
    }

    var os = Math.min(W, H) * 0.13;
    for (var oi = 0; oi < RN.obs.length; oi++) {
      var o = RN.obs[oi];
      var ox = W * ((o.lane + 0.5) / 3);
      var oy = H * o.y;
      ctx.fillStyle = '#ff2e63';
      ctx.fillRect(ox - os / 2, oy - os / 2, os, os);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
      ctx.strokeRect(ox - os / 2, oy - os / 2, os, os);
      ctx.beginPath();
      ctx.moveTo(ox - os * 0.3, oy - os * 0.3); ctx.lineTo(ox + os * 0.3, oy + os * 0.3);
      ctx.moveTo(ox + os * 0.3, oy - os * 0.3); ctx.lineTo(ox - os * 0.3, oy + os * 0.3);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
    }

    var px = W * RN.currentX;
    var py = H * RN.playerY;
    var pw = Math.min(W, H) * 0.1;
    ctx.fillStyle = 'rgba(0,255,136,0.25)';
    ctx.beginPath(); ctx.ellipse(px, py + pw * 0.6, pw * 0.7, pw * 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#00ff88';
    ctx.beginPath();
    ctx.moveTo(px, py - pw);
    ctx.lineTo(px - pw * 0.7, py + pw * 0.5);
    ctx.lineTo(px + pw * 0.7, py + pw * 0.5);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#00b86b'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(px, py, pw * 0.2, 0, Math.PI * 2); ctx.fill();
  }

  function runnerEnd() {
    RN.running = false;
    if (RN.raf) cancelAnimationFrame(RN.raf);
    if (RN._onKey) document.removeEventListener('keydown', RN._onKey);

    var sc = RN.score;
    var xp = Math.round(sc / 10);
    var isRec = sc > (S.br || 0);
    if (isRec) S.br = sc;
    addXP(xp);
    b3End('runner', sc);
    renderXP();
    res('runRes', sc + ' pts',
        (isRec ? 'Nouveau record ! ' : '') +
        '+' + xp + ' XP - ' + RN.coinsCollected + ' piece' + (RN.coinsCollected > 1 ? 's' : ''),
        'Rejouer', runnerStart);
    beep(880, 0.2); burstC();
  }

/* ===== Jeu 3 : Roue des thèmes ===== */
  var wheel = $('wheel');
  wheel.style.background = 'conic-gradient(' + TH.map(function (t, i) { return t.b + ' ' + i * 60 + 'deg ' + (i + 1) * 60 + 'deg'; }).join(',') + ')';
  TH.forEach(function (t, i) {
    var l = document.createElement('span'); l.textContent = t.n;
    l.style.transform = 'rotate(' + (i * 60 + 30 - 90) + 'deg) translate(calc(var(--u)*6),-50%)'; wheel.appendChild(l);
  });
  $('spin').onclick = function (e) {
    e.stopPropagation(); if (G.spin) return; G.spin = 1;
    G.rot = (G.rot || 0) + 1800 + Math.floor(Math.random() * 360); wheel.style.transform = 'rotate(' + G.rot + 'deg)';
    $('wMsg').textContent = 'Ça tourne…'; buzz([30, 40, 30]);
    var tk = setInterval(function () { beep(300 + Math.random() * 200, .03); }, 140);
    setTimeout(function () {
      clearInterval(tk); var k = Math.floor(((360 - G.rot % 360) % 360) / 60);
      setTheme(k); addXP(10); $('wMsg').textContent = 'Thème ' + TH[k].n + ' ! +10 XP'; burstC(); beep(880, .25); G.spin = 0;
    }, 4300);
  };

  /* ----- Taille adaptée à l'écran (WebView) + zoom ----- */
  if (!document.querySelector('meta[name=viewport]')) { var mv = document.createElement('meta'); mv.name = 'viewport'; mv.content = 'width=device-width, initial-scale=1, viewport-fit=cover'; document.head.appendChild(mv); }
  var zoomEl = $('phZoom'), Z = 1;
  function setZ(z, keep) { Z = Math.min(1.5, Math.max(.45, z)); zoomEl.style.transform = 'scale(' + Z.toFixed(3) + ')'; if (!keep) { S.z = Z; save(); } }
  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    overlay.style.setProperty('--vh', vh + 'px');
    overlay.style.setProperty('--ph', Math.round(Math.min(vh * .78, 700, vw * .84 / .485)) + 'px');
  }
  var fitT; function fitSoon() { cancelAnimationFrame(fitT); fitT = requestAnimationFrame(fit); }
  fit(); setZ(S.z || 1, 1);
  window.addEventListener('resize', fitSoon); window.addEventListener('orientationchange', function () { setTimeout(fit, 250); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fitSoon);
  $('zIn').onclick = function () { setZ(Z + .1); }; $('zOut').onclick = function () { setZ(Z - .1); };
  $('zFit').onclick = function () { setZ(1); ox = oy = 0; };
  overlay.addEventListener('wheel', function (e) { e.preventDefault(); setZ(Z - e.deltaY * .001); }, { passive: false });
  var ptrs = {}, pd = 0, pz = 1;
  function pdist() { var k = Object.keys(ptrs); return Math.hypot(ptrs[k[0]].clientX - ptrs[k[1]].clientX, ptrs[k[0]].clientY - ptrs[k[1]].clientY); }
  overlay.addEventListener('pointerdown', function (e) { ptrs[e.pointerId] = e; if (Object.keys(ptrs).length === 2) { pd = pdist(); pz = Z; drag = false; } });
  overlay.addEventListener('pointermove', function (e) { if (!ptrs[e.pointerId]) return; ptrs[e.pointerId] = e; if (Object.keys(ptrs).length === 2 && pd) setZ(pz * pdist() / pd, 1); });
  function pend(e) { delete ptrs[e.pointerId]; if (Object.keys(ptrs).length < 2 && pd) { pd = 0; S.z = Z; save(); } }
  overlay.addEventListener('pointerup', pend); overlay.addEventListener('pointercancel', pend);

  /* ----- Inclinaison + glisser pour tourner ----- */
  var tgx = 0, tgy = 0, ox = 0, oy = 0, cx0 = 0, cy0 = 0, drag = false, sx, sy, cr = { x:6, y:-12 };
  window.addEventListener('pointermove', function (e) {
    if (!gOn) { tgx = e.clientX / innerWidth - .5; tgy = e.clientY / innerHeight - .5; }
    if (drag) { ox = (e.clientX - sx) * .45; oy = -(e.clientY - sy) * .3; }
  });
  phone.addEventListener('pointerdown', function (e) { if (e.target.closest('.app,button,.garea canvas') || Object.keys(ptrs).length > 1) return; drag = true; sx = e.clientX; sy = e.clientY; });
  window.addEventListener('pointerup', function () { drag = false; });

  /* ----- Ciel + effets ----- */
  var sky = $('phSky'), fx = $('phFx'), sc = sky.getContext('2d'), fc = fx.getContext('2d');
  var W, H, stars = [], shoots = [], sparks = [], clicks = [];
  var calm = matchMedia('(prefers-reduced-motion:reduce)').matches;
  function resize() {
    W = sky.width = fx.width = innerWidth; H = sky.height = fx.height = innerHeight;
    stars = Array.from({ length: Math.min(110, W / 8) }, function () { return { x:Math.random() * W, y:Math.random() * H, r:Math.random() * 1.4 + .3, p:Math.random() * 6, z:.3 + Math.random() * 1.4 }; });
  }
  resize(); window.addEventListener('resize', resize);
  function mk(list, x, y, h, n, sp) {
    if (list.length > 500) return;
    for (var i = 0; i < n; i++) { var a = Math.random() * 6.283, v = 1 + Math.random() * sp; list.push({ x:x, y:y, vx:Math.cos(a) * v, vy:Math.sin(a) * v, l:1, h:h + Math.random() * 50 }); }
  }
  function boom(x, y, h, n) { mk(clicks, x, y, h, n || 60, 5); }
  if (!calm) {
    setInterval(function () { if (S.fx && shown()) shoots.push({ x:Math.random() * W, y:-10, vx:-6 - Math.random() * 5, vy:5 + Math.random() * 4 }); }, 1300);
    setInterval(function () { if (S.fx && shown()) mk(sparks, W * (.1 + Math.random() * .8), H * (.1 + Math.random() * .5), Math.random() * 360, 46, 3.6); }, 3200);
  }
  function drawP(c, list) {
    list.forEach(function (p) { c.globalAlpha = p.l; c.fillStyle = 'hsl(' + p.h + ',100%,65%)'; c.beginPath(); c.arc(p.x, p.y, 2.2, 0, 6.283); c.fill(); p.x += p.vx * 2; p.y += p.vy * 2; p.vy += .1; p.l -= .028; });
  }
  var raf = 0, fr = 0, lastRx = 99, lastRy = 99, fxOn = 0;
  var bodyEl = phone.querySelector('.ph-body'), gloss = phone.querySelector('.ph-gloss');
  function shown() { return overlay.style.display !== 'none' && !document.hidden; }
  function wake() { if (!raf && shown()) raf = requestAnimationFrame(frame); }
  document.addEventListener('visibilitychange', wake);
  function frame(t) {
    raf = 0; if (!shown()) return;
    raf = requestAnimationFrame(frame); fr++;
    ox *= drag ? 1 : .9; oy *= drag ? 1 : .9;
    var tk = S.tilt ? 1 : 0, ry = -12 + tgx * 30 * tk + ox, rx = 6 - tgy * 22 * tk + oy;
    cr.x += (rx - cr.x) * .12; cr.y += (ry - cr.y) * .12;
    if (Math.abs(cr.x - lastRx) > .03 || Math.abs(cr.y - lastRy) > .03) {
      lastRx = cr.x; lastRy = cr.y;
      phone.style.transform = 'rotateX(' + cr.x.toFixed(2) + 'deg) rotateY(' + cr.y.toFixed(2) + 'deg)';
      if (fr % 2 === 0) { bodyEl.style.setProperty('--ang', (210 + cr.y * 5).toFixed(0) + 'deg'); gloss.style.setProperty('--gx', (50 + (cr.y + 12) * 2.4).toFixed(0) + '%'); }
    }
    if (fr % 2) return;
    sc.clearRect(0, 0, W, H);
    stars.forEach(function (s) { var px = ((s.x - (cr.y + 12) * s.z * 3) % W + W) % W, py = ((s.y + (cr.x - 6) * s.z * 3) % H + H) % H; sc.globalAlpha = .45 + .55 * Math.sin(t / 700 + s.p); sc.fillStyle = '#fff'; sc.beginPath(); sc.arc(px, py, s.r * s.z, 0, 6.283); sc.fill(); });
    shoots = shoots.filter(function (s) { return s.y < H + 40 && s.x > -120; });
    shoots.forEach(function (s) {
      var g = sc.createLinearGradient(s.x, s.y, s.x - s.vx * 9, s.y - s.vy * 9); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
      sc.globalAlpha = 1; sc.strokeStyle = g; sc.lineWidth = 2; sc.beginPath(); sc.moveTo(s.x, s.y); sc.lineTo(s.x - s.vx * 9, s.y - s.vy * 9); sc.stroke(); s.x += s.vx * 2; s.y += s.vy * 2;
    });
    sparks = sparks.filter(function (p) { return p.l > 0; }); clicks = clicks.filter(function (p) { return p.l > 0; });
    drawP(sc, sparks);
    if (clicks.length || fxOn) { fc.clearRect(0, 0, W, H); drawP(fc, clicks); fxOn = clicks.length; }
  }
  wake();

  /* ----- Fermer / rouvrir ----- */
  $('phClose').onclick = function () { overlay.dataset.closed = '1'; update(); };

  /* ----- Visibilité selon la page ----- */
  /* ----- Pages où le HUD ne doit PAS apparaître (inscription/connexion) ----- */
/* ----- Pages où le HUD ne doit PAS apparaître (inscription/connexion) ----- */
function noHudPage() {
  var p = location.pathname.toLowerCase();
  return /^\/(reg|login)(\/|$)/.test(p) ||
         /^\/(registration|signin|signup|auth)(\/|$)/.test(p) ||
         /^\/account\/(login|register|signin|signup|reg)/.test(p);
}

/* ----- Visibilité selon la page ----- */
function update() {
  var isLink  = isLinkPage();
  var closed  = overlay.dataset.closed === '1';
  var hideOvl = isLink || closed;

  if (hideOvl) {
    try { stopGames(); } catch (e) {}
    closeMenu();
    if (raf) { try { cancelAnimationFrame(raf); } catch (e) {} raf = 0; }
    overlay.style.display    = 'none';
    overlay.style.visibility = 'hidden';
    overlay.setAttribute('aria-hidden', 'true');
    ['phSky', 'phFx'].forEach(function (id) {
      var c = document.getElementById(id);
      if (c) c.style.display = 'none';
    });
  } else {
    overlay.style.display    = '';
    overlay.style.visibility = '';
    overlay.removeAttribute('aria-hidden');
    ['phSky', 'phFx'].forEach(function (id) {
      var c = document.getElementById(id);
      if (c) c.style.display = '';
    });
  }

  var hideHud = noHudPage();
  if (hideHud) {
    closeMenu();
    hud.style.display   = 'none';
    toast.style.display = 'none';
  } else {
    hud.style.display   = '';
    toast.style.display = '';
  }

  wake();
}

/* ⬇️ APPEL INITIAL — indispensable ⬇️ */
update();

/* Le bouton flottant reste au-dessus de tout, sauf sur /reg et /login */
var lifting = 0, lw = 0, lc = 0, lo;
function lift() {
  if (lifting) return; lifting = 1;
  var now = Date.now();
  if (now - lw > 2000) { lw = now; lc = 0; }
  if (++lc > 12) { lo.disconnect(); return; }
  if (!noHudPage() && document.body.lastElementChild !== toast) {
    document.body.appendChild(hud);
    document.body.appendChild(toast);
  }
  setTimeout(function () { lifting = 0; }, 0);
}
lo = new MutationObserver(lift); lo.observe(document.body, { childList: true });
lift();

/* Re-déclenche update() sur navigation SPA */
['pushState', 'replaceState'].forEach(function (m) {
  var o = history[m];
  history[m] = function () { var r = o.apply(this, arguments); update(); return r; };
});
window.addEventListener('popstate', update);

/* Filet de sécurité : détecte les changements d'URL */
var last = location.href;
setInterval(function () {
  if (location.href !== last) { last = location.href; update(); }
}, 400);

/* Toast d'accueil, seulement sur la home */
setTimeout(function () {
  if (!isLinkPage() && !noHudPage()) showToast('✨ Glisse pour tourner le téléphone');
}, 700);
})();
</script>
